<!DOCTYPE html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أخبارنا - بوابتك الإخبارية</title>

    <!-- روابط خطوط وأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style/akhbarana.css" />
    <link rel="stylesheet" href="./style/modify.css" />
    <link rel="stylesheet" href="./style/all.min.css" />
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./style/normalize.css" />


    <!-- ملف التنسيقات -->
    <link rel="stylesheet" href="./style/tricker.css" />
  </head>
  <body>
      <!-- start setting-box -->
    <div class="setting-box">
      <div class="icon">
        <i class="fa fa-bars"></i>
      </div>
      <div class="setting-container">
        <span class="close-x">X</span>

        <div class="setting-text first">
          <div class="option-text">
            <span class="option-span">الرئيسية</span>
            <i class="fa-solid fa-house"></i>
          </div>
        </div>

        <div class="setting-text">
          <div class="option-text">
            <span class="option-span">الرياضة</span>
            <i class="fa-solid fa-futbol"></i>
          </div>
        </div>

        <div class="setting-text">
          <div class="option-text">
            <span class="option-span">الاقتصاد</span>
            <i class="fa-solid fa-chart-line"></i>
          </div>
        </div>
      </div>
    </div>

    <nav>
      <!-- Left side -->
      <div class="left">
        <div class="price"><span>$</span> 30.90 ج.م</div>
        <div class="time">🕒 18:30 المغرب</div>
      </div>
    </nav>
    <div class="center">
      <h1>أخبارنا</h1>
      <p>بوابتك الإخبارية الشاملة</p>

      <div class="line"></div>
    </div>
    <div class="bar">
      <marquee
        behavior="scroll"
        direction="right"
        scrollamount="10"
        id="newsMarquee"
      ></marquee>
    </div>

    <!-- slider-->
    <main>
      <section class="container">
        <section class="slider">
          <button id="pre">‹</button>
          <button id="nxt">›</button>
          <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </section>
      </section>
    </main>

    <div class="modal" id="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <img id="modal-img" src="" alt="">
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
      </div>
    </div>
   



    <!-- footer-->
    <footer>
      <div class="footer-top">
        <div class="footer-left">
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#"><i class="fa-brands fa-github"></i></a>
        </div>
        <div class="footer-right">
          <a href="#">الرئيسية <i class="fa-solid fa-house"></i></a>
          <a href="#">الرياضة <i class="fa-solid fa-trophy"></i></a>
          <a href="#">الاقتصاد <i class="fa-solid fa-dollar-sign"></i></a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2025 أخبارنا - جميع الحقوق محفوظة</p>
      </div>
    </footer>

    <!-- ✅ سكربتات -->
    <script src="./js/all.min.js"></script>
    <script src="./js/main.js"></script>
     <script src="./js/tricker.js"></script>
  </body>
</html>
