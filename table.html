<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أخبارنا</title>
  <link rel="stylesheet" href="table.css">
</head>
<body>

  <header>
    <h1>أخبارنا</h1>
    <p>بوابتك الإخبارية الشاملة</p>
  </header>

  <div class="bar">
    <marquee behavior="scroll" direction="right" scrollamount="5" id="newsMarquee"></marquee>
  </div>
  <main>
    
    <p>جدول ترتيب الدوري المصري الممتاز</p>

    <table id="leagueTable">
      <thead>
        <tr>
          <th>الترتيب</th>
          <th>الفريق</th>
          <th>لعب</th>
          <th>منزل</th>
          <th>خارج</th>
          <th>فوز</th>
          <th>تعادل</th>
          <th>خسارة</th>
          <th>له</th>
          <th>عليه</th>
          <th>النقاط</th>
        </tr>
      </thead>
      <tbody>
        
      </tbody>
    </table>
    <div class="legend">
  <div class="item">
    <span class="color champions"></span>
    <span>مراكز دوري الابطال</span>
  </div>
  <div class="item">
    <span class="color confed"></span>
    <span>مراكز دوري الهبوط</span>
  </div>
 
</div>

  </main>

  <footer>
    <p>© 2025 أخبارنا - جميع الحقوق محفوظة</p>
  </footer>


  <script>
  
const leagueData = [
    { rank: 1, team: 'الأهلي', played: 20, home: 10, away: 10, wins: 16, draws: 3, losses: 1, goalsFor: 48, goalsAgainst: 12, points: 51 },
    { rank: 2, team: 'الزمالك', played: 20, home: 10, away: 10, wins: 14, draws: 3, losses: 3, goalsFor: 42, goalsAgainst: 18, points: 45 },
    { rank: 3, team: 'بيراميدز', played: 20, home: 10, away: 10, wins: 13, draws: 3, losses: 4, goalsFor: 39, goalsAgainst: 20, points: 42 },
    { rank: 4, team: 'الإسماعيلي', played: 20, home: 10, away: 10, wins: 11, draws: 5, losses: 4, goalsFor: 35, goalsAgainst: 22, points: 38 },
    { rank: 5, team: 'طلائع الجيش', played: 20, home: 10, away: 10, wins: 10, draws: 6, losses: 4, goalsFor: 32, goalsAgainst: 24, points: 36 },
    { rank: 6, team: 'المصري', played: 20, home: 10, away: 10, wins: 9, draws: 7, losses: 4, goalsFor: 30, goalsAgainst: 22, points: 34 },
    { rank: 7, team: 'سيراميكا', played: 20, home: 10, away: 10, wins: 8, draws: 8, losses: 4, goalsFor: 28, goalsAgainst: 20, points: 32 },
    { rank: 8, team: 'المقاولون', played: 20, home: 10, away: 10, wins: 8, draws: 6, losses: 6, goalsFor: 26, goalsAgainst: 24, points: 30 },
    { rank: 9, team: 'إنبي', played: 20, home: 10, away: 10, wins: 7, draws: 7, losses: 6, goalsFor: 24, goalsAgainst: 25, points: 28 },
    { rank: 10, team: 'الجونة', played: 20, home: 10, away: 10, wins: 6, draws: 8, losses: 6, goalsFor: 22, goalsAgainst: 26, points: 26 },
    { rank: 11, team: 'البنك الأهلي', played: 20, home: 10, away: 10, wins: 5, draws: 9, losses: 6, goalsFor: 20, goalsAgainst: 24, points: 24 },
    { rank: 12, team: 'الاتحاد السكندري', played: 20, home: 10, away: 10, wins: 5, draws: 7, losses: 8, goalsFor: 18, goalsAgainst: 28, points: 22 },

];

const tbody = document.querySelector('#leagueTable tbody');

leagueData.forEach(team => {
    const row = document.createElement('tr');
    row.innerHTML = `
        <td><span class="circle2">${team.rank}</span></td>
        <td>${team.team}</td>
        <td>${team.played}</td>
        <td>${team.home}</td>
        <td>${team.away}</td>
        <td>${team.wins}</td>
        <td>${team.draws}</td>
        <td>${team.losses}</td>
        <td>${team.goalsFor}</td>
        <td>${team.goalsAgainst}</td>
        <td><span class="circle">${team.points}</span></td>
    `;
    tbody.appendChild(row);
});

    const tickerNews = [
      'الأهلي يتأهل لنهائي دوري أبطال أفريقيا',
      'ارتفاع أسعار الذهب عالمياً',
      'الرئيس يفتتح مشروع تنموي جديد',
      'منتخب مصر يستعد لمواجهة حاسمة',
      'تطورات جديدة في الأوضاع الاقتصادية',
      'افتتاح معرض القاهرة الدولي للكتاب',
    ];

    const marqueeElement = document.getElementById('newsMarquee');

    tickerNews.forEach(newsItem => {
      const span = document.createElement('span');
      span.className = 'news';
      span.textContent = newsItem;
      marqueeElement.appendChild(span);
    });
  </script>

</body>
</html>
